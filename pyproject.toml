[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-osint-security-analyzer"
version = "2.0.0"
authors = [{ name = "Matthew Frazer" }]
description = "AI-driven OSINT security analysis of IPs, domains, CVEs and software versions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
keywords = ["osint", "security", "threat-intelligence", "vulnerability", "cve", "ai-agent", "cohere", "streamlit"]
dependencies = [
    "streamlit==1.66.1",
    "cohere==7.2.0",
    "shodan==1.31.0",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.urls]
Homepage = "https://github.com/MRFrazer25/AI-OSINT-Security-Analyzer"
Repository = "https://github.com/MRFrazer25/AI-OSINT-Security-Analyzer"
Issues = "https://github.com/MRFrazer25/AI-OSINT-Security-Analyzer/issues"

[tool.setuptools]
py-modules = ["ai", "osint_tools", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
