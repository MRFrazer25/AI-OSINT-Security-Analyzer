[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnerability-exposure-analyzer"
version = "2.0.0"
authors = [{ name = "Matthew Frazer" }]
description = "AI-driven analysis of IPs, domains, CVEs and software versions for confirmed vulnerabilities and exposure"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
keywords = ["osint", "security", "threat-intelligence", "vulnerability", "cve", "ai-agent", "cohere", "streamlit"]
dependencies = [
    "streamlit==1.66.1",
    "cohere==7.3.0",
    "shodan==1.31.0",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "pillow==13.0.0",  # Streamlit dependency, pinned for its security fixes
    "filelock==4.2.4",  # cohere and shodan dependency, pinned for its security fixes
    "certifi==2026.10.23",  # requests' CA bundle, without the revoked eMudhra/emSign certificates
    "altair==6.3.0",  # Streamlit dependency, imported directly for the severity chart
    "pandas==3.1.0",  # Streamlit dependency, the severity chart's data
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[project.urls]
Homepage = "https://github.com/MRFrazer25/Vulnerability-Exposure-Analyzer"
Repository = "https://github.com/MRFrazer25/Vulnerability-Exposure-Analyzer"
Issues = "https://github.com/MRFrazer25/Vulnerability-Exposure-Analyzer/issues"

[tool.setuptools]
py-modules = ["ai", "lookups", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
